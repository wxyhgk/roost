name: Desktop

# 只在打标签时跑。平时往 main 推不触发——想手动查一次用 workflow_dispatch。
#
# 这里**不要加 paths-ignore**：对唯一的触发源它完全无效。GitHub 的原话是
# 「Path filters are not evaluated for pushes of tags.」
# （docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
#   → on.<push>.<paths|paths-ignore>）
# 它原本是给往 main 的日常推送省 runner 的，而那条触发源已经不存在了。留着只会让人
# 以为发布构建能被路径过滤掉。
#
# 真正在起作用的是相邻的另一条规则：只写 tags 不写 branches 时，往分支推不触发。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    # 历史最长的一次是 628s（Windows，cargo 缓存全冷那轮），20 分钟仍有 1.9 倍余量。
    # 原来是 45——tags-only 之后跑 CI 的时候人是在等发版的，挂死一次白等 45 分钟。
    # 真正可能无界挂住的是 tauri build 和 ci.mjs test 里的 NSIS 静默安装；
    # windows-ui.mjs 自己带超时。
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read application and toolchain versions
        id: metadata
        run: node desktop/scripts/ci.mjs metadata
      # **不要加 `cache: npm`**，它在这个仓库必然未命中。键里含 package-lock.json 的
      # 哈希，而 `npm run version:set` 每次发版都会改 lock 里的版本号——实测 v0.0.6 的
      # Windows 键是 ba9bbd74…、v0.0.7 是 9150958c…，两次发版没有一次能复用。
      #
      # 代价不只是白跑：每次发版白写约 330MB（两个平台各 166MB），而缓存配额是 10GB、
      # 当时已用到 4.45GB。撞上限时按 LRU 先被驱逐的正是那几份 534MB 的 rust 缓存——
      # 也就是说这个从来不命中的缓存，在挤掉真正有用的那个。
      #
      # 少掉它 npm ci 慢 2~4s（实测命中 23s / 未命中 25~27s），这个价钱值得。
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.metadata.outputs.node }}
      # 这一步的实际作用是**装**工具链（rust-toolchain.toml 钉的 1.96.0）。原来只写
      # `rustup show active-toolchain`，靠的是 rustup 的隐式自动安装，而它自己在日志里
      # 说了要拿掉：「auto-installation is deprecated for most rustup commands」。
      # 真拿掉的那天，这一步会**安静地成功**，构建落到 runner 镜像自带的那个 Rust 上
      # （日志里 rust-cache 同时列出 1.96.0 和镜像自带的 1.98.1），然后在几步之后炸出
      # 一个跟工具链毫不相干的错。
      #
      # 不带参数的 `rustup install` 是 rustup 自己给的替代命令，原话就在同一段警告里：
      #   warn: to install the active toolchain, use `rustup install` instead
      # 它读 rust-toolchain.toml，所以版本号不用在这儿抄第二遍。show 留着当日志确认。
      - name: Install pinned Rust
        working-directory: desktop
        run: |
          rustup install
          rustup show active-toolchain
      # Windows runner 上 Defender 的实时扫描会逐个去碰 cargo 写出来的中间产物，
      # 而 485 个 crate 的 release 编译正是「大量小文件」的极端情况。把 target 和
      # cargo home 排除掉，不改任何产物。
      #
      # 失败了就算了（策略收紧、权限不够都可能），这只是省时间，不是正确性的一环——
      # 所以 continue-on-error，不要让它把整条流水线带红。
      - name: Exclude cargo paths from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\desktop\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      # 实测（run 34797834876）：Windows 那 485s 里有 333s 是 Rust——Build desktop 259s
      # 加 cargo test 74s，占 69%。而此前**只缓存了 Node 归档、没有任何 cargo 缓存**，
      # Cargo.lock 里 485 个 crate 每次 run 全部从零编译。这是个遗漏，不是权衡。
      #
      # 键不用自己拼：add-rust-environment-hash-key 默认开着，已经把 Cargo.lock、
      # Cargo.toml、rust-toolchain.toml 一起哈希进去了；再叠一个 matrix.target，
      # 免得两个平台的产物互相污染。
      #
      # **注意这份缓存经常会是冷的。** 这个 workflow 只在打标签时触发，而 GitHub 的缓存
      # 7 天不被访问就驱逐——两次发版隔一周以上就等于没有。真要让它稳定命中，得再配一条
      # 每周一次的 schedule 去养缓存；在那之前，这一步的收益是「发版密集时有、平时没有」。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install dependencies
        run: npm ci
      - name: Check types and package boundaries
        run: |
          npm run typecheck --workspaces --if-present
          node scripts/check-boundaries.mjs
      - name: Check platform contracts
        run: |
          node --test desktop/tests/targets.test.mjs
          node --import tsx --test packages/terminal-runtime/tests/windows.test.ts
          node --import tsx --test backend/tests/windows-paths.test.ts frontend/tests/file-links.test.ts
      # 归档是每次都要从 nodejs.org 下的约 30MB，之前没有缓存——CI 因此在一次瞬时
      # `fetch failed` 上红过。缓存把这个失败面直接去掉（下载本身也有重试兜底）。
      #
      # key 里带 runtime-lock.json 的哈希：Node 版本一变就是另一个 key，不会取到旧的。
      # 不设 restore-keys——模糊回落只会把另一个版本的目录搬过来占地方，而代码是按
      # 确切文件名判断在不在的，照样要下。
      #
      # 缓存安全的前提是：从缓存读出来仍然按 sha256 校验（见 node-runtime.mjs 里
      # `Cached Node archive checksum mismatch` 那行），坏内容会当场报错而不是被用掉。
      - name: Cache Node runtime archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: desktop/.cache/node
          key: node-runtime-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('desktop/runtime-lock.json') }}
      - name: Prepare and test runtime before native compilation
        run: |
          npm run desktop:prepare -- --target "${{ matrix.target }}"
          node --test --test-concurrency=1 desktop/tests/*.test.mjs
      - name: Build desktop
        run: npm run desktop:build -- --skip-frontend --target "${{ matrix.target }}"
      - name: Test Rust host and manifest
        working-directory: desktop/src-tauri
        run: cargo test --locked --release --target "${{ matrix.target }}"
      - name: Test installed production runtime
        run: node desktop/scripts/ci.mjs test
      - name: Package verified artifacts
        run: node desktop/scripts/ci.mjs package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Roost-${{ steps.metadata.outputs.version }}-${{ matrix.target }}
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish desktop preview
    needs: build
    # event_name 那一条不能省：在一个**已经发布过**的 tag 上手动 workflow_dispatch
    # 复查构建时，ref_type 同样是 tag，于是 gh release create 撞上已存在的 release 而
    # 失败——想复查一次，换来一个红叉。dispatch 只跑构建，不发布。
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download both verified platform artifacts
        run: gh run download "$GITHUB_RUN_ID" --pattern 'Roost-*' --dir desktop/artifacts/downloads
      - name: Verify release version, commit and checksums
        run: node desktop/scripts/release.mjs desktop/artifacts/downloads desktop/artifacts/release
      - name: Publish versioned installers
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/artifacts/release/* \
            --verify-tag --title "Roost $GITHUB_REF_NAME" \
            --notes-file desktop/artifacts/release-notes.md
