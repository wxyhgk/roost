<!doctype html><meta charset="utf-8"><title>Terminal file links regression</title>
<style>body{background:#181818;color:#eee;font:14px sans-serif}#host{position:relative;margin:80px 30px;width:800px;height:280px}#result{white-space:pre-wrap}</style>
<p>Click the file link below. This fixture has no PTY or backend connection.</p><pre id="result">No file opened</pre><div id="host"></div>
<script type="module">
import { mountXterm } from '/src/features/terminal/xtermEngine.ts';
import { emitFileLink, subscribeFileLink, subscribeFileLinkOpen } from '/src/features/terminal/fileLinks.ts';
const result=document.querySelector('#result');
let unsubscribe;
subscribeFileLinkOpen(()=>{
 if(!unsubscribe) unsubscribe=subscribeFileLink('fixture',req=>{result.textContent='OPENED '+req.path+':'+req.line;});
});
const term=mountXterm(document.querySelector('#host'),{background:'#181818',foreground:'#eeeeee'},link=>emitFileLink({...link,sessionId:'fixture'}));
term.write('文件 .github/workflows/release-desktop.yml:5\r\nplain src/app.ts:12\r\nhttps://example.com\r\n');
</script>
