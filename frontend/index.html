<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      装成应用时的图标。没有 manifest 的话 Edge / Chrome 会拿标题首字母画一个，于是
      只看得到一个 "R"。

      图标必须是**不透明底的 PNG**，不能复用 favicon.svg：那个 svg 按
      prefers-color-scheme 在近黑和近白之间切填充色，适合画在网页里；而应用图标是画在
      系统的背景上的，透明底 + 近白图形在浅色任务栏上会直接消失。
      所以这几张是固定深底浅鸟，不跟随主题。

      maskable 那张图形只占 56%（普通版 72%）：Android/Edge 会按内切圆裁，安全区是
      内侧 80%，按普通版的留白会把鸟的边缘切掉。

      图标放在根目录而不是 icons/ 子目录，是因为安装清单的路径校验只放行 assets/ 和
      logos/ 两个子目录（见 scripts/install-workbench.mjs）。那条正则是防路径穿越的，
      为了摆图标去放宽它不划算。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1c1e" />
    <title>Roost</title>
    <script>
      document.documentElement.dataset.theme =
        // 改名那一次：搬运在模块里跑，而这段在它之前执行，所以这里自己认一次旧键，
        // 否则改名后第一次打开会闪一下错误的主题。等浏览器都搬完就可以只留前一个。
        (localStorage.getItem("roost-theme") ?? localStorage.getItem("diy-theme")) === "light" ? "light" : "dark";
    </script>
    <!--
      字体是**自托管**的，@font-face 写在 src/index.css 里，所以这里没有任何跨域请求。

      原来这儿是一条指向 fonts.googleapis.com 的渲染阻塞样式表，外加两个 preconnect。
      去掉它解决两件事：国内访问那两个域名连不上，而渲染阻塞的样式表指向不可达主机时浏览器
      会等到超时才开始画；桌面版的 CSP（style-src 'self' + font-src 'self' data:）也从来
      不允许它，Windows 上终端字母之间空一大格就是这么来的。

      这段注释留着，是为了别有人"顺手"把外链加回来——它看起来只是少下 37 KB，实际是把
      白屏和桌面版的字体一起放回去。理由细节见 src/index.css 顶部。
    -->
    <!--
      **首屏骨架：外壳在 JS 之前就画出来。**

      `#root` 原来是空的，于是从 HTML 到达到 React 挂载之间，屏幕上一个像素都没有。
      本机看不出来（首次绘制 266ms），跨公网就很明显：实测 1.5Mbps / 250ms 的链路上
      **纯白 2.5 秒**——首屏那一波是 281 KB（主 chunk 186 + ErrorBoundary 52 +
      bridge 31 + css 12），得等它下完、解析完、跑完。

      这里画的是 `Shell` 的三块外壳：顶栏 40px、左侧图标栏 40px、底部状态栏 30px，
      以及中间的底色。**不画面板分隔**——三栏宽度是从 localStorage 恢复的，猜错了
      反而在接管的那一刻跳一下。

      两个约束，改的时候都别丢：

      - **颜色只能写字面值。** tokens.css 在那 281 KB 里，此刻还没到；写 var() 会拿到
        空值，得到一块白。字面值和 tokens.css 会漂移，所以 `tests/boot-skeleton.test.ts`
        盯着两边一致。
      - **样式必须内联。** 挂成外部样式表就又变成一次往返，等于没做。

      它不需要任何人来删：`createRoot().render()` 首次提交会清空容器，骨架和真外壳
      在同一帧里换过去。
    -->
    <style>
      body { margin: 0; }
      .boot { display: flex; height: 100dvh; flex-direction: column; background: #111113; }
      .boot-bar { height: 40px; flex-shrink: 0; background: #1c1c1e; }
      .boot-mid { display: flex; min-height: 0; flex: 1; }
      .boot-rail { width: 40px; flex-shrink: 0; background: #1c1c1e; }
      .boot-status { height: 30px; flex-shrink: 0; background: #1c1c1e; }
      /* 触屏上状态栏是 40px（见 app/statusBar.css 的 pointer: coarse 那条）。 */
      @media (pointer: coarse) { .boot-status { height: 40px; } }
      html[data-theme="light"] .boot { background: #f4f4f6; }
      html[data-theme="light"] .boot-bar,
      html[data-theme="light"] .boot-rail,
      html[data-theme="light"] .boot-status { background: #e7e7eb; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-bar"></div>
        <div class="boot-mid"><div class="boot-rail"></div></div>
        <div class="boot-status"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
